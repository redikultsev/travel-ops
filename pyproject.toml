[project]
name = "travel-ops"
version = "0.1.0"
description = "Live flight and stay search across many sellers, built for agents"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "airportsdata>=20260905",
    "camoufox[geoip]>=0.5.7",
    "curl-cffi>=0.16.3",
    "mcp>=2.3.0,<3",
    "playwright>=1.62.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
travelops = "travelops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/travelops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits real websites; run by hand only"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
