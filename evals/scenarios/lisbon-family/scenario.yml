# A family of three to Lisbon: a route with connections, a child, and sellers that cannot price a child.
# Recorded live on 2026-10-06 from nine sources.
now: "2026-10-06T10:22:28+00:00"
context: >
  The human lives in Belgrade, Serbia. Today is 6 October 2026.
turns:
  - say: "летим втроём — я, жена и сын, ему 7 — в Лиссабон с 12 по 16 ноября. что есть?"
    calls:
      require:
        - tool: search_trip
          arguments:
            origin: BEG
            place: {any: [Lisbon, "Lisbon, Portugal", Lisboa]}
            depart: "2026-11-12"
            return_date: "2026-11-16"
            adults: 2
            children_ages: [7]
