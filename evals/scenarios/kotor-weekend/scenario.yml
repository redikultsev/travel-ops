# A weekend in Kotor, asked the way people ask: a country, two dates, a town. Recorded live on 2026-10-05.
now: "2026-10-05T23:44:00+00:00"
context: >
  The human lives in Belgrade, Serbia, and travels alone. Today is 6 October 2026.
turns:
